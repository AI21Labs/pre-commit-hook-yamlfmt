---
version: 2
updates:
    - package-ecosystem: pip
      directories:
          - /
          - /ci
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore
          include: scope
      ignore:
          # 0.17.22+ wraps long plain scalars in a way yamllint rejects.
          - dependency-name: ruamel.yaml

    - package-ecosystem: pre-commit
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore
          include: scope
